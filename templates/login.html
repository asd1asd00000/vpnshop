<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به مدیریت | VPNShop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css');
        body {
            font-family: 'Vazirmatn', sans-serif;
            background: linear-gradient(135deg, #1e293b 0%, #312e81 100%);
            min-height: 100vh;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <div class="bg-white rounded-2xl shadow-2xl overflow-hidden">
            <div class="bg-gray-800 px-6 py-5 text-center">
                <h1 class="text-xl font-bold text-white">🔐 ورود به داشبورد مدیریت</h1>
                <p class="text-gray-400 text-sm mt-1">VPNShop</p>
            </div>
            <form method="POST" class="p-6 space-y-4">
                {{if .Failed}}
                <div class="bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg p-3 text-center font-bold">
                    ❌ نام کاربری یا رمز عبور اشتباه است
                </div>
                {{end}}
                <div>
                    <label class="block text-sm text-gray-600 mb-1">نام کاربری</label>
                    <input type="text" name="username" required autofocus
                           class="w-full border border-gray-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-sm text-gray-600 mb-1">رمز عبور</label>
                    <input type="password" name="password" required
                           class="w-full border border-gray-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-indigo-500">
                </div>
                <button type="submit"
                        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-lg transition">
                    ورود
                </button>
            </form>
        </div>
    </div>
</body>
</html>
